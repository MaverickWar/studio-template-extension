<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Popup</title>
  </head>
  <body>
    <main class="popup">
      <header class="popup-head">
        <span class="brand"><span class="mark" aria-hidden="true" id="mark">S</span><span id="name">Extension</span></span>
        <span class="muted" id="summary" aria-live="polite"></span>
      </header>
      <form class="add-row" id="add">
        <label class="sr-only" for="new-task">New task</label>
        <input id="new-task" class="input" placeholder="Add a task" autocomplete="off" />
        <button class="btn btn-primary" type="submit" aria-label="Add task">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
        </button>
      </form>
      <ul class="tasks" id="list"></ul>
      <div class="empty" id="empty" hidden><strong>All clear</strong><p class="muted">Add your first task above.</p></div>
      <p class="popup-foot muted">Saved in the browser. Edit entrypoints/popup/main.ts to make it yours.</p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
